# HAProxy in front of the kit's test server, speaking the PROXY protocol to it.
#
# NOT YET RUN: HAProxy was not installed where this was written. Ports (all on loopback):
#   18080  the kit's server (Tests/SwiftHTTPServiceNIOTests/BalancerCheckServer.swift)
#   18081  frontend whose backend sends PROXY protocol version 2 (send-proxy-v2)
#   18082  frontend whose backend sends PROXY protocol version 1 (send-proxy)
#
# "http-request set-src" makes HAProxy claim the source address named in the X-Test-Src request header, and that claimed
# address is what it puts in the PROXY header (HAProxy configuration manual, "http-request set-src"). That is how a
# check from loopback can tell the client the handler sees apart from the socket's peer (which is always 127.0.0.1).
global
    maxconn 256

defaults
    mode http
    timeout connect 3s
    timeout client  10s
    timeout server  10s

frontend v2
    bind 127.0.0.1:18081
    http-request set-src hdr(X-Test-Src)
    default_backend kit_v2

frontend v1
    bind 127.0.0.1:18082
    http-request set-src hdr(X-Test-Src)
    default_backend kit_v1

backend kit_v2
    server kit 127.0.0.1:18080 send-proxy-v2

backend kit_v1
    server kit 127.0.0.1:18080 send-proxy
