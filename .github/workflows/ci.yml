# Continuous integration: build and test on Linux (a Swift 6.2 container) and on macOS.
#
# Run since 2026-11-10: both jobs pass. Linux tests run serially (see the step); the Linux job also runs the PROXY protocol
# check against the distribution's HAProxy.
#
# The private dependency. Package.swift depends on the owner's private repository SwiftTLSKit by an SSH URL
# (git@github.com:jpurnell/SwiftTLSKit.git). Every other dependency is public. To let the runners resolve it:
#   1. Make an SSH key pair used for nothing else:   ssh-keygen -t ed25519 -N '' -C 'swifthttpservice-ci' -f ci_key
#   2. Add ci_key.pub as a read-only DEPLOY KEY on github.com/jpurnell/SwiftTLSKit (Settings, Deploy keys; leave "Allow
#      write access" off).
#   (The key is offered through ~/.ssh/config; see the step that writes it.)
#   3. Add the private half (the whole contents of ci_key) as an Actions secret of THIS repository named
#      SWIFTTLSKIT_DEPLOY_KEY, then delete the local ci_key.
# A deploy key reaches one repository, which is the point: a token or a personal key would reach all of them. If
# SwiftTLSKit ever gains a private dependency of its own, that needs a second key, and the job will say so by failing
# at "swift package resolve". Pull requests from forks get no secrets, so they cannot resolve the dependency: the
# key step says so instead of failing obscurely.
#
# macOS: the manifest says swift-tools-version 6.2, which needs Xcode 26. "macos-latest" may still carry an older
# default Xcode, so the job selects the newest Xcode installed on the image and prints the compiler it got.
#
# quality-gate is not installed on the runners (it is the owner's tool, and the git hooks run it): CI builds and tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (swift:6.2)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools the container may lack (git is in the image; ssh may not be)
        # Retried, and each attempt bounded: the Ubuntu mirrors have answered with an inconsistent index and, once, not at all.
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sh -c 'apt-get update && apt-get install -y --no-install-recommends openssh-client ca-certificates'; then exit 0; fi
            echo "apt attempt $attempt failed"; sleep 10
          done
          exit 1
      - name: Access to the private SwiftTLSKit
        env:
          DEPLOY_KEY: ${{ secrets.SWIFTTLSKIT_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "SWIFTTLSKIT_DEPLOY_KEY is not set (a fork's pull request has no secrets); the dependency cannot be fetched."; exit 1; fi
          # In this container ssh looks for known_hosts and config in the passwd home (/root), not in $HOME (/github/home, which
          # Actions sets), so files under ~/.ssh are never read. System-wide files under /etc/ssh are read whatever the home is.
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/ci_key" && chmod 600 "$HOME/.ssh/ci_key"
          ssh-keyscan -t ed25519,rsa github.com >> /etc/ssh/ssh_known_hosts
          mkdir -p /etc/ssh/ssh_config.d
          printf 'Host github.com\n  HostName github.com\n  User git\n  IdentityFile %s/.ssh/ci_key\n  IdentitiesOnly yes\n' "$HOME" > /etc/ssh/ssh_config.d/ci.conf
          if ! grep -q '^Include /etc/ssh/ssh_config.d' /etc/ssh/ssh_config; then
            { echo 'Include /etc/ssh/ssh_config.d/*.conf'; cat /etc/ssh/ssh_config; } > /tmp/ssh_config
            cp /tmp/ssh_config /etc/ssh/ssh_config
          fi
          git ls-remote git@github.com:jpurnell/SwiftTLSKit.git HEAD
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift6.2-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: linux-swift6.2-
      - run: swift --version
      - run: swift package resolve
      - run: swift build --build-tests
      # Serial: the timing tests use 300 ms limits over real sockets, and run in parallel on a two-core runner they measure
      # the runner's contention, not the kit. The fd limit and exit status are printed because a crash prints nothing else.
      - name: swift test
        run: |
          ulimit -n
          swift test --no-parallel; status=$?
          echo "swift test exited with $status"
          exit $status
      # The PROXY protocol against an independent implementation: our own tests share our reading of the specification.
      - name: PROXY protocol against HAProxy
        run: |
          apt-get install -y --no-install-recommends haproxy curl   # the script requests with curl, which the image lacks
          haproxy -v | head -1
          ./Scripts/proxy-protocol-check.sh

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the image (the manifest needs Swift 6.2)
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version
      - name: Access to the private SwiftTLSKit
        env:
          DEPLOY_KEY: ${{ secrets.SWIFTTLSKIT_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "SWIFTTLSKIT_DEPLOY_KEY is not set (a fork's pull request has no secrets); the dependency cannot be fetched."; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          # An ssh config entry, not git's core.sshCommand: SwiftPM sets GIT_SSH_COMMAND itself (to stop prompts), and that
          # variable outranks core.sshCommand, so the key would never be offered.
          printf 'Host github.com\n  HostName github.com\n  User git\n  IdentityFile %s/.ssh/ci_key\n  IdentitiesOnly yes\n' "$HOME" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          git ls-remote git@github.com:jpurnell/SwiftTLSKit.git HEAD
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: macos-
      - run: swift package resolve
      - run: swift build --build-tests
      - run: swift test
